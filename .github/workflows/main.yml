
name: Trivy Docker Image Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Scan UI and API Images
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Trivy
      - name: Install Trivy
        run: |
          echo "Installing Trivy..."
      
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
      
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
      
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
      
          sudo apt-get update
          sudo apt-get install -y trivy
      
          echo "Checking Trivy..."
          trivy --version
          which trivy

      # 3. Prepare report directories
      - name: Create Report Directories
        run: |
          mkdir -p reports/ui
          mkdir -p reports/api

      # 4. Download HTML template
      - name: Download Trivy HTML Template
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o html.tpl

          test -s html.tpl

      # 5. Scan UI Docker image
      - name: Scan UI Image
        run: |
          set -e
      
          mkdir -p reports/ui
      
          echo "Scanning NGINX image..."
      
          trivy image \
            --scanners vuln \
            --format json \
            --output reports/ui/trivy-results.json \
            nginx:1.27
      
          trivy convert \
            --format table \
            --output reports/ui/trivy-results.txt \
            reports/ui/trivy-results.json
      
          trivy convert \
            --format template \
            --template "@html.tpl" \
            --output reports/ui/trivy-results.html \
            reports/ui/trivy-results.json
      
          echo "UI scan completed"

      # 6. Scan API Docker image
      - name: Scan API Image
        run: |
          set -e
      
          mkdir -p reports/api
      
          echo "Scanning Python image..."
      
          trivy image \
            --scanners vuln \
            --format json \
            --output reports/api/trivy-results.json \
            python:3.12-slim
      
          trivy convert \
            --format table \
            --output reports/api/trivy-results.txt \
            reports/api/trivy-results.json
      
          trivy convert \
            --format template \
            --template "@html.tpl" \
            --output reports/api/trivy-results.html \
            reports/api/trivy-results.json
      
          echo "API scan completed"
      
      # 7. Display TXT reports in workflow logs
      - name: Display Scan Summary
        if: always()
        run: |
          echo "========== UI Scan Report =========="
          if [ -f reports/ui/trivy-results.txt ]; then
            cat reports/ui/trivy-results.txt
          fi

          echo "========== API Scan Report =========="
          if [ -f reports/api/trivy-results.txt ]; then
            cat reports/api/trivy-results.txt
          fi

      # 8. Upload reports as downloadable artifacts
      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
