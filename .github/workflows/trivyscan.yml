
name: Docker Image Security Scan with Trivy

on:
  push:
    branches:
      - main
    paths:
      - 'trivy-demo/**'
      - '.github/workflows/trivy-scan.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'trivy-demo/**'
      - '.github/workflows/trivy-scan.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-scan:
    name: Build Docker Image and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t trivy-demo:${{ github.sha }} \
            .

      - name: Scan image and generate JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: trivy-demo:${{ github.sha }}
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      - name: Scan image and display security findings
        id: trivy-gate
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: trivy-demo:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload JSON vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce security quality gate
        if: steps.trivy-gate.outcome == 'failure'
        run: |
          echo "Security gate failed: HIGH or CRITICAL vulnerabilities detected."
          exit 1
