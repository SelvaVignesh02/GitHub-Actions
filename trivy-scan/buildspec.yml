
version: 0.2

env:
  variables:
    UI_IMAGE: "selvavignesh02/zomato:v2"
    API_IMAGE: "selvavignesh02/petmanagement_backend"
    TRIVY_IMAGE: "aquasec/trivy:0.70.0"

phases:
  install:
    commands:
      - mkdir -p reports/ui reports/api .trivy-cache
      - docker --version
      - docker pull "${TRIVY_IMAGE}"

  build:
    commands:
      - |
        set -eu

        scan_image() {
          NAME="$1"
          IMAGE="$2"
          DIR="reports/${NAME}"

          echo "========== Scanning ${IMAGE} =========="

          # Pull the image
          docker pull "${IMAGE}"

          # Generate JSON report
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/${DIR}:/reports" \
            -v "$(pwd)/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            image \
            --image-src docker \
            --scanners vuln \
            --format json \
            --output /reports/trivy-results.json \
            "${IMAGE}"

          # Convert JSON report to TXT table
          docker run --rm \
            -v "$(pwd)/${DIR}:/reports" \
            -v "$(pwd)/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            convert \
            --format table \
            --output /reports/trivy-results.txt \
            /reports/trivy-results.json

          echo "JSON: ${DIR}/trivy-results.json"
          echo "TXT : ${DIR}/trivy-results.txt"

          # Display the TXT report in CodeBuild logs
          cat "${DIR}/trivy-results.txt"
        }

        scan_image "ui" "${UI_IMAGE}"
        scan_image "api" "${API_IMAGE}"

  post_build:
    commands:
      - echo "========== Generated Trivy Reports =========="
      - find reports -type f -print

artifacts:
  files:
    - reports/ui/trivy-results.json
    - reports/ui/trivy-results.txt
    - reports/api/trivy-results.json
    - reports/api/trivy-results.txt
  name: trivy-scan-reports
  discard-paths: no
