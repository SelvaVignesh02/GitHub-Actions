
version: 0.2

env:
  variables:
    UI_IMAGE: "selvavignesh02/zomato:v2"
    API_IMAGE: "selvavignesh02/petmanagement_backend"

    MAX_CRITICAL: "0"
    MAX_HIGH: "5"
    MAX_MEDIUM: "10"

    TRIVY_IMAGE: "aquasec/trivy:0.70.0"

phases:
  install:
    commands:
      - |
        set -eu

        mkdir -p reports/ui reports/api .trivy-cache

        echo "Checking Docker..."
        docker --version
        docker info

        echo "Checking Python..."
        python3 --version

        echo "Pulling Trivy scanner image..."
        docker pull "${TRIVY_IMAGE}"

  pre_build:
    commands:
      - |
        set -eu

        echo "========== DOCKER IMAGE SCAN CONFIGURATION =========="
        echo "UI image: ${UI_IMAGE}"
        echo "API image: ${API_IMAGE}"
        echo "Maximum CRITICAL: ${MAX_CRITICAL}"
        echo "Maximum HIGH: ${MAX_HIGH}"
        echo "Maximum MEDIUM: ${MAX_MEDIUM}"

        echo "Public Docker Hub images assumed."
        echo "Image pulling will happen in the build phase."

  build:
    commands:
      - |
        set -u

        scan_image() {
          NAME="$1"
          IMAGE="$2"
          DIR="reports/${NAME}"

          mkdir -p "${DIR}"
          rm -f "${DIR}/scan-error.txt" \
                "${DIR}/trivy-results.json" \
                "${DIR}/scan-exit-code.txt"

          echo ""
          echo "========== SCANNING ${NAME}: ${IMAGE} =========="

          echo "Pulling image..."
          if ! docker pull "${IMAGE}"; then
            echo "Image pull failed: ${IMAGE}" |
              tee "${DIR}/scan-error.txt"
            echo "1" > "${DIR}/scan-exit-code.txt"
            return 1
          fi

          echo "Running Trivy vulnerability scan..."

          if ! docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$(pwd)/${DIR}:/reports" \
              -v "$(pwd)/.trivy-cache:/root/.cache/trivy" \
              "${TRIVY_IMAGE}" \
              image \
              --image-src docker \
              --scanners vuln \
              --exit-code 0 \
              --format json \
              --output /reports/trivy-results.json \
              "${IMAGE}"; then
            echo "Trivy scan failed: ${IMAGE}" |
              tee "${DIR}/scan-error.txt"
            echo "1" > "${DIR}/scan-exit-code.txt"
            return 1
          fi

          if [ ! -s "${DIR}/trivy-results.json" ]; then
            echo "JSON report missing or empty: ${IMAGE}" |
              tee "${DIR}/scan-error.txt"
            echo "1" > "${DIR}/scan-exit-code.txt"
            return 1
          fi

          if ! python3 -m json.tool \
              "${DIR}/trivy-results.json" >/dev/null; then
            echo "Invalid JSON report: ${IMAGE}" |
              tee "${DIR}/scan-error.txt"
            echo "1" > "${DIR}/scan-exit-code.txt"
            return 1
          fi

          echo "Generating TXT report..."
          docker run --rm \
            -v "$(pwd)/${DIR}:/reports" \
            -v "$(pwd)/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            convert \
            --format table \
            --output /reports/trivy-results.txt \
            /reports/trivy-results.json ||
              echo "WARNING: TXT conversion failed."

          echo "Generating SARIF report..."
          docker run --rm \
            -v "$(pwd)/${DIR}:/reports" \
            -v "$(pwd)/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            convert \
            --format sarif \
            --output /reports/trivy-results.sarif \
            /reports/trivy-results.json ||
              echo "WARNING: SARIF conversion failed."

          echo "0" > "${DIR}/scan-exit-code.txt"

          echo "Generating image summary..."
          python3 - "${DIR}/trivy-results.json" \
            "${DIR}/scan-summary.txt" "${IMAGE}" <<'PY'
        import json
        import sys
        from collections import Counter
        from datetime import datetime, timezone

        json_file, summary_file, image = sys.argv[1:4]

        with open(json_file, encoding="utf-8") as f:
            data = json.load(f)

        counts = Counter()
        for result in data.get("Results") or []:
            for vuln in result.get("Vulnerabilities") or []:
                counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

        severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]

        lines = [
            "Trivy Vulnerability Scan Summary",
            "================================",
            f"Image: {image}",
            f"Scan date UTC: {datetime.now(timezone.utc).isoformat()}",
            f"Total vulnerabilities: {sum(counts.values())}",
            "",
        ]
        lines.extend(f"{s}: {counts[s]}" for s in severities)

        report = "\n".join(lines) + "\n"
        with open(summary_file, "w", encoding="utf-8") as f:
            f.write(report)

        print(report)
        PY

          echo "Reports generated for ${IMAGE}:"
          ls -lh "${DIR}/"
          return 0
        }

        # Run both scans even if one image fails.
        scan_image "ui" "${UI_IMAGE}" || true
        scan_image "api" "${API_IMAGE}" || true

        echo ""
        echo "========== CHECKING SECURITY THRESHOLDS =========="

        python3 - <<'PY'
        import json
        import os
        from collections import Counter

        limits = {
            "CRITICAL": int(os.getenv("MAX_CRITICAL", "0")),
            "HIGH": int(os.getenv("MAX_HIGH", "5")),
            "MEDIUM": int(os.getenv("MAX_MEDIUM", "10")),
        }

        overall = Counter()
        errors = []
        violations = []
        lines = [
            "Docker Image Vulnerability Report",
            "=================================",
            "",
        ]

        for name in ("ui", "api"):
            directory = f"reports/{name}"
            json_file = f"{directory}/trivy-results.json"
            error_file = f"{directory}/scan-error.txt"
            status_file = f"{directory}/scan-exit-code.txt"

            lines.append(f"Image: {name.upper()}")

            failed = (
                os.path.exists(error_file)
                or not os.path.isfile(json_file)
            )

            if os.path.isfile(status_file):
                with open(status_file, encoding="utf-8") as f:
                    failed = failed or f.read().strip() != "0"
            else:
                failed = True

            if failed:
                errors.append(name)
                lines.extend(["Scan status: ERROR", ""])
                continue

            try:
                with open(json_file, encoding="utf-8") as f:
                    data = json.load(f)
            except (OSError, json.JSONDecodeError) as exc:
                errors.append(name)
                lines.extend([f"Scan status: ERROR - {exc}", ""])
                continue

            counts = Counter()
            for result in data.get("Results") or []:
                for vuln in result.get("Vulnerabilities") or []:
                    counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

            lines.append("Scan status: SUCCESS")

            for severity in (
                "CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"
            ):
                lines.append(f"{severity}: {counts[severity]}")
                overall[severity] += counts[severity]

            for severity, maximum in limits.items():
                if counts[severity] > maximum:
                    violations.append(
                        f"{name.upper()}: {severity}={counts[severity]}, "
                        f"maximum allowed={maximum}"
                    )

            lines.append("")

        lines.extend(["OVERALL COUNTS", "--------------"])
        for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
            lines.append(f"{severity}: {overall[severity]}")

        lines.extend(["", "THRESHOLD VIOLATIONS"])
        lines.extend([f"FAIL: {v}" for v in violations] or ["None"])
        lines.append(
            f"Scan errors: {', '.join(errors) if errors else 'None'}"
        )

        failed = bool(errors or violations)
        lines.extend(["", f"POLICY RESULT: {'FAIL' if failed else 'PASS'}"])

        report = "\n".join(lines) + "\n"
        print(report)

        os.makedirs("reports", exist_ok=True)

        with open("reports/combined-summary.txt", "w", encoding="utf-8") as f:
            f.write(report)

        with open("reports/policy-result.txt", "w", encoding="utf-8") as f:
            f.write("FAIL\n" if failed else "PASS\n")

        with open("reports/build-exit-code.txt", "w", encoding="utf-8") as f:
            f.write("1\n" if failed else "0\n")
        PY

        echo ""
        echo "========== ALL REPORTS =========="
        find reports -type f -exec ls -lh {} \;

  post_build:
    commands:
      - |
        echo "========== COMBINED SCAN SUMMARY =========="
        cat reports/combined-summary.txt 2>/dev/null || true

        echo ""
        echo "========== SECURITY POLICY RESULT =========="
        cat reports/policy-result.txt 2>/dev/null || true

        echo ""
        echo "========== REPORT FILES =========="
        find reports -type f -exec ls -lh {} \; 2>/dev/null || true

        if [ "$(cat reports/build-exit-code.txt 2>/dev/null || echo 1)" != "0" ]; then
          echo "BUILD FAILED: Scan error or vulnerability threshold exceeded."
          exit 1
        fi

        echo "BUILD PASSED: Both images meet the configured thresholds."

artifacts:
  files:
    - "reports/**/*"
  name: "docker-image-trivy-reports"
  discard-paths: no
