
version: 0.2

env:
  variables:
    UI_IMAGE: "nginx:1.27.0"
    API_IMAGE: "bkimminich/juice-shop:latest"

    MAX_CRITICAL: "0"
    MAX_HIGH: "5"
    MAX_MEDIUM: "10"

phases:
  install:
    commands:
      - |
        set -eu

        mkdir -p reports/ui reports/api

        echo "Downloading Trivy installer..."
        curl -fSL --retry 3 \
          https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          -o /tmp/install-trivy.sh

        echo "Installing Trivy..."
        sh /tmp/install-trivy.sh -b /usr/local/bin

        echo "Verifying Trivy installation..."
        command -v trivy
        trivy --version

        echo "Checking Python..."
        python3 --version

  pre_build:
    commands:
      - |
        set -eu

        echo "========== IMAGE SCAN CONFIGURATION =========="
        echo "UI image: ${UI_IMAGE}"
        echo "API image: ${API_IMAGE}"
        echo "Maximum CRITICAL: ${MAX_CRITICAL}"
        echo "Maximum HIGH: ${MAX_HIGH}"
        echo "Maximum MEDIUM: ${MAX_MEDIUM}"

        echo "Checking Docker..."
        docker --version

        echo "Pulling UI image..."
        docker pull "${UI_IMAGE}"

        echo "Pulling API image..."
        docker pull "${API_IMAGE}"

  build:
    commands:
      - |
        set -u

        # Scan an image and generate reports.
        # Do not fail immediately when Trivy returns a non-zero status.
        scan_image() {
          NAME="$1"
          IMAGE="$2"
          DIR="reports/${NAME}"

          echo ""
          echo "========== SCANNING ${NAME}: ${IMAGE} =========="

          SCAN_STATUS=0

          trivy image \
            --scanners vuln \
            --format json \
            --output "${DIR}/trivy-results.json" \
            "${IMAGE}" || SCAN_STATUS=$?

          echo "${SCAN_STATUS}" > "${DIR}/scan-exit-code.txt"

          if [ ! -s "${DIR}/trivy-results.json" ]; then
            echo "ERROR: JSON report was not generated for ${IMAGE}" \
              | tee "${DIR}/scan-error.txt"
            return 1
          fi

          echo "Generating TXT report..."
          trivy convert \
            --format table \
            --output "${DIR}/trivy-results.txt" \
            "${DIR}/trivy-results.json" || true

          echo "Generating SARIF report..."
          trivy convert \
            --format sarif \
            --output "${DIR}/trivy-results.sarif" \
            "${DIR}/trivy-results.json" || true

          echo "Generating per-image summary..."

          python3 - "${DIR}/trivy-results.json" \
            "${DIR}/scan-summary.txt" "${IMAGE}" <<'PY'
        import json
        import sys
        from collections import Counter
        from datetime import datetime, timezone

        json_file, summary_file, image = sys.argv[1:4]

        with open(json_file, encoding="utf-8") as f:
            data = json.load(f)

        counts = Counter()

        for result in data.get("Results") or []:
            for vuln in result.get("Vulnerabilities") or []:
                counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

        severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]

        lines = [
            "Trivy Image Vulnerability Scan Summary",
            "======================================",
            f"Image: {image}",
            f"Scan date (UTC): {datetime.now(timezone.utc).isoformat()}",
            f"Total vulnerabilities: {sum(counts.values())}",
            ""
        ]

        lines.extend(
            f"{severity}: {counts[severity]}"
            for severity in severities
        )

        with open(summary_file, "w", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")

        print("\n".join(lines))
        PY

          echo "Reports generated for ${IMAGE}:"
          ls -lh "${DIR}/"

          return 0
        }

        # Attempt both scans, even if one scan fails.
        scan_image "ui" "${UI_IMAGE}" || true
        scan_image "api" "${API_IMAGE}" || true

        echo ""
        echo "========== GENERATING COMBINED SUMMARY AND POLICY RESULT =========="

        python3 - <<'PY'
        import json
        import os
        from collections import Counter

        limits = {
            "CRITICAL": int(os.getenv("MAX_CRITICAL", "0")),
            "HIGH": int(os.getenv("MAX_HIGH", "5")),
            "MEDIUM": int(os.getenv("MAX_MEDIUM", "10")),
        }

        overall_counts = Counter()
        errors = []
        violations = []

        lines = [
            "Trivy Vulnerability Threshold Report",
            "====================================",
            ""
        ]

        for name in ("ui", "api"):
            directory = f"reports/{name}"
            json_file = f"{directory}/trivy-results.json"
            error_file = f"{directory}/scan-error.txt"
            status_file = f"{directory}/scan-exit-code.txt"

            lines.append(f"Image: {name.upper()}")

            scan_failed = (
                os.path.exists(error_file)
                or not os.path.isfile(json_file)
            )

            if os.path.isfile(status_file):
                with open(status_file, encoding="utf-8") as f:
                    if f.read().strip() != "0":
                        scan_failed = True

            if scan_failed:
                errors.append(name)
                lines.extend(["Scan status: ERROR", ""])
                continue

            try:
                with open(json_file, encoding="utf-8") as f:
                    data = json.load(f)
            except (OSError, json.JSONDecodeError) as exc:
                errors.append(name)
                lines.extend([f"Scan status: ERROR - {exc}", ""])
                continue

            counts = Counter()

            for result in data.get("Results") or []:
                for vuln in result.get("Vulnerabilities") or []:
                    counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

            lines.append("Scan status: SUCCESS")

            for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
                lines.append(f"{severity}: {counts[severity]}")
                overall_counts[severity] += counts[severity]

            for severity, limit in limits.items():
                actual = counts[severity]

                if actual > limit:
                    violations.append(
                        f"{name.upper()}: {severity} count {actual} "
                        f"exceeds allowed maximum {limit}"
                    )

            lines.append("")

        lines.extend([
            "OVERALL VULNERABILITY COUNTS",
            "----------------------------"
        ])

        for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
            lines.append(f"{severity}: {overall_counts[severity]}")

        lines.extend(["", "THRESHOLD VIOLATIONS"])

        if violations:
            lines.extend(f"FAIL: {item}" for item in violations)
        else:
            lines.append("None")

        lines.append(
            f"Scan errors: {', '.join(errors) if errors else 'None'}"
        )

        failed = bool(errors or violations)
        lines.extend([
            "",
            f"POLICY RESULT: {'FAIL' if failed else 'PASS'}"
        ])

        report = "\n".join(lines) + "\n"
        print(report)

        with open("reports/combined-summary.txt", "w", encoding="utf-8") as f:
            f.write(report)

        with open("reports/policy-result.txt", "w", encoding="utf-8") as f:
            f.write("FAIL\n" if failed else "PASS\n")

        with open("reports/build-exit-code.txt", "w", encoding="utf-8") as f:
            f.write("1\n" if failed else "0\n")
        PY

        echo ""
        echo "========== ALL REPORTS =========="
        find reports -type f -exec ls -lh {} \;

  post_build:
    commands:
      - |
        echo "========== COMBINED SUMMARY =========="
        cat reports/combined-summary.txt 2>/dev/null || true

        echo ""
        echo "========== SECURITY POLICY =========="
        cat reports/policy-result.txt 2>/dev/null || true

        echo ""
        echo "========== FINAL REPORT FILES =========="
        find reports -type f -exec ls -lh {} \;

        echo "Reports generated. CodeBuild will attempt artifact upload."

        if [ "$(cat reports/build-exit-code.txt 2>/dev/null || echo 1)" != "0" ]; then
          echo "BUILD FAILED: Scan error or vulnerability threshold exceeded."
          exit 1
        fi

        echo "BUILD PASSED: All image scans are within configured thresholds."

artifacts:
  files:
    - "reports/**/*"
  name: trivy-scan-reports
  discard-paths: no
