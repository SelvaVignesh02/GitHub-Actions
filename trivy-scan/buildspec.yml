
version: 0.2

env:
  variables:
    UI_IMAGE: "nginx:latest"
    API_IMAGE: "node:22-bookworm-slim"
    TRIVY_IMAGE: "aquasec/trivy:0.70.0"

phases:
  install:
    commands:
      - |
        set -eu

        mkdir -p reports/ui reports/api .trivy-cache

        echo "========== CHECKING ENVIRONMENT =========="
        docker --version
        docker info
        python3 --version

        echo "========== PULLING TRIVY =========="
        docker pull "${TRIVY_IMAGE}"

  pre_build:
    commands:
      - |
        set -eu

        echo "========== SCAN CONFIGURATION =========="
        echo "UI image  : ${UI_IMAGE}"
        echo "API image : ${API_IMAGE}"
        echo "Trivy     : ${TRIVY_IMAGE}"

  build:
    commands:
      - |
        set -eu

        scan_image() {
          NAME="$1"
          IMAGE="$2"
          DIR="reports/${NAME}"

          mkdir -p "${DIR}"

          rm -f "${DIR}/trivy-results.json" \
                "${DIR}/trivy-results.txt"

          echo ""
          echo "=========================================="
          echo "SCANNING ${NAME}: ${IMAGE}"
          echo "=========================================="

          echo "Pulling image..."
          docker pull "${IMAGE}"

          echo "Generating JSON vulnerability report..."

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/${DIR}:/reports" \
            -v "$(pwd)/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            image \
            --image-src docker \
            --scanners vuln \
            --exit-code 0 \
            --format json \
            --output /reports/trivy-results.json \
            "${IMAGE}"

          echo "Generating TXT table report..."

          docker run --rm \
            -v "$(pwd)/${DIR}:/reports" \
            -v "$(pwd)/.trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            convert \
            --format table \
            --output /reports/trivy-results.txt \
            /reports/trivy-results.json

          if [ ! -s "${DIR}/trivy-results.json" ]; then
            echo "ERROR: JSON report missing or empty"
            return 1
          fi

          if [ ! -s "${DIR}/trivy-results.txt" ]; then
            echo "ERROR: TXT report missing or empty"
            return 1
          fi

          echo ""
          echo "========== ${NAME} DETAILED VULNERABILITY TABLE =========="
          cat "${DIR}/trivy-results.txt"

          echo ""
          echo "========== ${NAME} SEVERITY SUMMARY =========="

          python3 - "${DIR}/trivy-results.json" <<'PY'
        import json
        import sys
        from collections import Counter

        path = sys.argv[1]

        with open(path, encoding="utf-8") as f:
            report = json.load(f)

        counts = Counter()

        for result in report.get("Results") or []:
            for vuln in result.get("Vulnerabilities") or []:
                severity = vuln.get("Severity", "UNKNOWN").upper()
                counts[severity] += 1

        print(f"{'SEVERITY':<15} {'COUNT':>10}")
        print("-" * 27)

        for severity in (
            "CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"
        ):
            print(f"{severity:<15} {counts[severity]:>10}")

        print("-" * 27)
        print(f"{'TOTAL':<15} {sum(counts.values()):>10}")
        PY

          echo ""
          echo "JSON report: ${DIR}/trivy-results.json"
          echo "TXT report : ${DIR}/trivy-results.txt"
        }

        scan_image "ui" "${UI_IMAGE}"
        scan_image "api" "${API_IMAGE}"

        echo ""
        echo "========== OVERALL SUMMARY TABLE =========="

        python3 <<'PY'
        import json
        from collections import Counter

        print(
            f"{'IMAGE':<10} {'CRITICAL':>10} {'HIGH':>10} "
            f"{'MEDIUM':>10} {'LOW':>10} {'UNKNOWN':>10} {'TOTAL':>10}"
        )
        print("-" * 82)

        overall = Counter()

        for name in ("ui", "api"):
            path = f"reports/{name}/trivy-results.json"

            with open(path, encoding="utf-8") as f:
                report = json.load(f)

            counts = Counter()

            for result in report.get("Results") or []:
                for vuln in result.get("Vulnerabilities") or []:
                    counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

            for severity in (
                "CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"
            ):
                overall[severity] += counts[severity]

            total = sum(counts.values())

            print(
                f"{name.upper():<10} "
                f"{counts['CRITICAL']:>10} "
                f"{counts['HIGH']:>10} "
                f"{counts['MEDIUM']:>10} "
                f"{counts['LOW']:>10} "
                f"{counts['UNKNOWN']:>10} "
                f"{total:>10}"
            )

        print("-" * 82)
        print(
            f"{'TOTAL':<10} "
            f"{overall['CRITICAL']:>10} "
            f"{overall['HIGH']:>10} "
            f"{overall['MEDIUM']:>10} "
            f"{overall['LOW']:>10} "
            f"{overall['UNKNOWN']:>10} "
            f"{sum(overall.values()):>10}"
        )
        PY

  post_build:
    commands:
      - |
        echo ""
        echo "========== FINAL REPORT FILES =========="
        find reports -type f -exec ls -lh {} \;

        echo ""
        echo "========== UI VULNERABILITY TABLE =========="
        cat reports/ui/trivy-results.txt 2>/dev/null || true

        echo ""
        echo "========== API VULNERABILITY TABLE =========="
        cat reports/api/trivy-results.txt 2>/dev/null || true

artifacts:
  files:
    - "reports/ui/trivy-results.json"
    - "reports/ui/trivy-results.txt"
    - "reports/api/trivy-results.json"
    - "reports/api/trivy-results.txt"
  name: "trivy-scan-reports"
  discard-paths: no
