
version: 0.2

env:
  variables:
    UI_IMAGE: "nginx:1.27.0"
    API_IMAGE: "bkimminich/juice-shop:latest"
    TRIVY_VERSION: "0.64.1"
    FAIL_ON_HIGH_CRITICAL: "true"

phases:
  install:
    commands:
      - |
        set -eu

        mkdir -p reports/ui reports/api

        echo "Checking required tools..."
        command -v curl
        command -v tar
        command -v docker
        command -v python3

        echo "Downloading Trivy version ${TRIVY_VERSION}..."
        curl -fSL --retry 3 \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
          -o /tmp/trivy.tar.gz

        echo "Extracting Trivy..."
        tar -xzf /tmp/trivy.tar.gz -C /tmp trivy

        install -m 0755 /tmp/trivy /usr/local/bin/trivy

        echo "Verifying installation..."
        trivy --version
        docker --version
        python3 --version

  pre_build:
    commands:
      - |
        echo "======================================"
        echo "Trivy Docker Image Vulnerability Scan"
        echo "======================================"
        echo "UI image: ${UI_IMAGE}"
        echo "API image: ${API_IMAGE}"
        echo "Reports directory: reports/"
        echo "Vulnerability policy: ${FAIL_ON_HIGH_CRITICAL}"

  build:
    commands:
      - |
        set -u

        scan_image() {
          NAME="$1"
          IMAGE="$2"
          DIR="reports/${NAME}"

          mkdir -p "${DIR}"

          echo ""
          echo "======================================"
          echo "Scanning ${NAME}: ${IMAGE}"
          echo "======================================"

          # Pull the image; preserve the error and continue
          # so the other image can still be scanned.
          if ! docker pull "${IMAGE}"; then
            echo "Image pull failed: ${IMAGE}" \
              | tee "${DIR}/scan-error.txt"
            echo "1" > "${DIR}/scan-error-code.txt"
            return 0
          fi

          # Generate the complete vulnerability JSON report.
          if ! trivy image \
              --scanners vuln \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format json \
              --output "${DIR}/trivy-results.json" \
              "${IMAGE}"; then

            echo "Trivy scan failed: ${IMAGE}" \
              | tee "${DIR}/scan-error.txt"
            echo "1" > "${DIR}/scan-error-code.txt"
            return 0
          fi

          echo "JSON report generated."

          # Generate human-readable vulnerability table.
          if trivy convert \
              --format table \
              --output "${DIR}/trivy-results.txt" \
              "${DIR}/trivy-results.json"; then
            echo "TXT report generated."
          else
            echo "TXT conversion failed." \
              | tee "${DIR}/txt-conversion-error.txt"
          fi

          # Generate SARIF for compatible security tools.
          if trivy convert \
              --format sarif \
              --output "${DIR}/trivy-results.sarif" \
              "${DIR}/trivy-results.json"; then
            echo "SARIF report generated."
          else
            echo "SARIF conversion failed." \
              | tee "${DIR}/sarif-conversion-error.txt"
          fi

          # Count vulnerabilities by severity.
          python3 - "${DIR}/trivy-results.json" \
            "${DIR}/scan-summary.txt" "${IMAGE}" <<'PY'
        import json
        import sys
        from collections import Counter

        json_path, summary_path, image = sys.argv[1:4]
        counts = Counter()

        with open(json_path, encoding="utf-8") as f:
            data = json.load(f)

        for result in data.get("Results") or []:
            for vuln in result.get("Vulnerabilities") or []:
                counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

        severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]
        total = sum(counts.values())

        lines = [
            "Trivy Image Vulnerability Summary",
            f"Image: {image}",
            f"Total vulnerabilities: {total}",
            ""
        ]

        lines.extend(
            f"{severity}: {counts[severity]}"
            for severity in severities
        )

        with open(summary_path, "w", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")

        print("\n".join(lines))
        PY

          echo "0" > "${DIR}/scan-exit-code.txt"
        }

        # Scan both images independently.
        scan_image "ui" "${UI_IMAGE}"
        scan_image "api" "${API_IMAGE}"

        echo ""
        echo "Creating combined vulnerability summary..."

        python3 - <<'PY'
        import json
        import os
        from collections import Counter

        counts = Counter()
        scan_errors = []

        for name in ("ui", "api"):
            directory = f"reports/{name}"
            json_path = f"{directory}/trivy-results.json"
            error_path = f"{directory}/scan-error.txt"

            if os.path.exists(error_path) or not os.path.exists(json_path):
                scan_errors.append(name)
                continue

            with open(json_path, encoding="utf-8") as f:
                data = json.load(f)

            for result in data.get("Results") or []:
                for vuln in result.get("Vulnerabilities") or []:
                    counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

        severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]

        lines = [
            "Combined Trivy Vulnerability Summary",
            ""
        ]

        lines.extend(
            f"{severity}: {counts[severity]}"
            for severity in severities
        )

        lines.extend([
            f"Total vulnerabilities: {sum(counts.values())}",
            f"Images with scan errors: {', '.join(scan_errors) if scan_errors else 'None'}"
        ])

        print("\n".join(lines))

        with open("reports/combined-summary.txt", "w", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")

        critical_high = counts["CRITICAL"] + counts["HIGH"]
        policy_enabled = (
            os.getenv("FAIL_ON_HIGH_CRITICAL", "true").lower() == "true"
        )

        failed = bool(scan_errors) or (
            policy_enabled and critical_high > 0
        )

        with open("reports/policy-result.txt", "w", encoding="utf-8") as f:
            f.write("FAIL\n" if failed else "PASS\n")
            f.write(f"CRITICAL + HIGH: {critical_high}\n")
            f.write(f"Scan errors: {len(scan_errors)}\n")

        with open("reports/build-exit-code.txt", "w", encoding="utf-8") as f:
            f.write("1\n" if failed else "0\n")
        PY

        echo ""
        echo "========== GENERATED REPORTS =========="
        find reports -type f -exec ls -lh {} \;

  post_build:
    commands:
      - |
        echo "========== COMBINED SUMMARY =========="
        if [ -f reports/combined-summary.txt ]; then
          cat reports/combined-summary.txt
        fi

        echo ""
        echo "========== SECURITY POLICY =========="
        if [ -f reports/policy-result.txt ]; then
          cat reports/policy-result.txt
        fi

        echo ""
        echo "========== REPORT FILES =========="
        find reports -type f -exec ls -lh {} \;

        echo ""
        echo "CodeBuild will attempt to upload the configured artifacts."

        # Fail only after report generation has been attempted.
        if [ "$(cat reports/build-exit-code.txt 2>/dev/null || echo 1)" != "0" ]; then
          echo "BUILD FAILED: scan error or HIGH/CRITICAL vulnerability found."
          exit 1
        fi

        echo "BUILD PASSED: security policy satisfied."

artifacts:
  files:
    - "reports/**/*"
  name: trivy-image-scan-reports
  discard-paths: no
