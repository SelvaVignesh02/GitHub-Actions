
version: 0.2

env:
  variables:
    UI_IMAGE: "nginx:1.27.0"
    API_IMAGE: "bkimminich/juice-shop:latest"
    TRIVY_VERSION: "0.64.1"
    FAIL_ON_HIGH_CRITICAL: "true"

phases:
  install:
    commands:
      - |
        set -eu
        mkdir -p reports/ui reports/api

        echo "Installing Trivy ${TRIVY_VERSION}..."
        curl -fSL --retry 3 \
          https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          -o /tmp/install-trivy.sh

        sh /tmp/install-trivy.sh -b /usr/local/bin \
          "v${TRIVY_VERSION}"

        trivy --version
        docker --version
        python3 --version

  pre_build:
    commands:
      - |
        set -eu
        echo "Pulling UI image: ${UI_IMAGE}"
        docker pull "${UI_IMAGE}"

        echo "Pulling API image: ${API_IMAGE}"
        if [ "${API_IMAGE}" = "REPLACE_WITH_MINESPIDER_API_IMAGE:TAG" ]; then
          echo "ERROR: Update API_IMAGE with the actual image and tag."
          exit 1
        fi
        docker pull "${API_IMAGE}"

  build:
    commands:
      - |
        set -u

        scan_image() {
          NAME="$1"
          IMAGE="$2"
          DIR="reports/${NAME}"

          mkdir -p "${DIR}"
          echo "========================================"
          echo "Scanning ${NAME}: ${IMAGE}"
          echo "========================================"

          # JSON report is the source for all other reports.
          if trivy image \
              --scanners vuln \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format json \
              --output "${DIR}/trivy-results.json" \
              "${IMAGE}"; then
            echo "JSON scan completed for ${NAME}"
          else
            echo "Trivy scan failed for ${NAME}" \
              | tee "${DIR}/scan-error.txt"
            echo "1" > "${DIR}/scan-error-code.txt"
            return 0
          fi

          # Human-readable report.
          trivy convert \
            --format table \
            --output "${DIR}/trivy-results.txt" \
            "${DIR}/trivy-results.json" \
            || echo "TXT conversion failed for ${NAME}"

          # SARIF report for compatible security tools.
          trivy convert \
            --format sarif \
            --output "${DIR}/trivy-results.sarif" \
            "${DIR}/trivy-results.json" \
            || echo "SARIF conversion failed for ${NAME}"

          # Count vulnerabilities by severity.
          python3 - "${DIR}/trivy-results.json" \
            "${DIR}/scan-summary.txt" "${IMAGE}" <<'PY'
        import json
        import sys
        from collections import Counter

        json_path, summary_path, image = sys.argv[1:4]
        counts = Counter()

        with open(json_path, encoding="utf-8") as f:
            data = json.load(f)

        for result in data.get("Results") or []:
            for vuln in result.get("Vulnerabilities") or []:
                counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

        severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]
        total = sum(counts.values())

        lines = [
            "Trivy Image Vulnerability Scan Summary",
            f"Image: {image}",
            f"Total vulnerabilities: {total}",
            ""
        ]

        lines.extend(f"{severity}: {counts[severity]}" for severity in severities)

        with open(summary_path, "w", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")

        print("\n".join(lines))
        PY
        }

        # Scan both images and continue so one scan failure
        # does not prevent the other image from being checked.
        scan_image "ui" "${UI_IMAGE}"
        scan_image "api" "${API_IMAGE}"

        # Combined summary and policy decision.
        python3 - <<'PY'
        import json
        import os
        from collections import Counter

        counts = Counter()
        scan_errors = []

        for name in ("ui", "api"):
            directory = f"reports/{name}"
            json_path = f"{directory}/trivy-results.json"
            error_path = f"{directory}/scan-error.txt"

            if os.path.exists(error_path) or not os.path.exists(json_path):
                scan_errors.append(name)
                continue

            with open(json_path, encoding="utf-8") as f:
                data = json.load(f)

            for result in data.get("Results") or []:
                for vuln in result.get("Vulnerabilities") or []:
                    counts[vuln.get("Severity", "UNKNOWN").upper()] += 1

        severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]
        lines = ["Combined Trivy Vulnerability Summary", ""]

        for severity in severities:
            lines.append(f"{severity}: {counts[severity]}")

        lines.append(f"Total: {sum(counts.values())}")
        lines.append(f"Scan errors: {', '.join(scan_errors) if scan_errors else 'None'}")

        with open("reports/combined-summary.txt", "w", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")

        print("\n".join(lines))

        critical_or_high = counts["CRITICAL"] + counts["HIGH"]
        policy_enabled = os.getenv("FAIL_ON_HIGH_CRITICAL", "true").lower() == "true"
        failed = bool(scan_errors) or (policy_enabled and critical_or_high > 0)

        with open("reports/policy-result.txt", "w", encoding="utf-8") as f:
            f.write("FAIL\n" if failed else "PASS\n")
            f.write(f"Critical + High: {critical_or_high}\n")
            f.write(f"Scan errors: {len(scan_errors)}\n")

        with open("reports/build-exit-code.txt", "w", encoding="utf-8") as f:
            f.write("1\n" if failed else "0\n")
        PY

        echo "========== ALL REPORT FILES =========="
        find reports -type f -exec ls -lh {} \;

  post_build:
    commands:
      - |
        echo "========== COMBINED SUMMARY =========="
        cat reports/combined-summary.txt || true

        echo "========== POLICY RESULT =========="
        cat reports/policy-result.txt || true

        echo "Reports will be uploaded as CodeBuild artifacts."

        # Fail only after all scans and reports have been attempted.
        if [ "$(cat reports/build-exit-code.txt 2>/dev/null || echo 1)" != "0" ]; then
          echo "BUILD FAILED: scan error or HIGH/CRITICAL vulnerability policy violation."
          exit 1
        fi

        echo "BUILD PASSED: no HIGH/CRITICAL vulnerabilities or scan errors."

artifacts:
  files:
    - 'reports/**/*'
  name: trivy-image-scan-reports
  discard-paths: no
