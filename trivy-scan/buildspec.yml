
version: 0.2

env:
  variables:
    IMAGE_TO_SCAN: "nginx:1.27.0"

phases:
  install:
    commands:
      - |
        set -eu
        mkdir -p reports

        echo "Downloading Trivy installer..."
        curl -fSL --retry 3 \
          https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          -o /tmp/install-trivy.sh

        echo "Installing Trivy..."
        sh -x /tmp/install-trivy.sh -b /usr/local/bin

        echo "Verifying installation..."
        command -v trivy
        trivy --version

  pre_build:
    commands:
      - |
        set -eu
        echo "Pulling image: ${IMAGE_TO_SCAN}"
        docker pull "${IMAGE_TO_SCAN}"

  build:
    commands:
      - |
        set -eu
        echo "Scanning image and generating JSON..."
        trivy image \
          --scanners vuln \
          --format json \
          --output reports/trivy-results.json \
          "${IMAGE_TO_SCAN}"

        echo "Converting JSON to table..."
        trivy convert \
          --format table \
          --output reports/trivy-results.txt \
          reports/trivy-results.json

        echo "Generating SARIF report..."
        trivy convert \
          --format sarif \
          --output reports/trivy-results.sarif \
          reports/trivy-results.json

        echo "Scan completed:"
        ls -lh reports/

artifacts:
  files:
    - reports/**/*
  discard-paths: no
